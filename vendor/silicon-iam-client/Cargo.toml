# Normalized from the pinned upstream workspace; see UPSTREAM.md.

[package]
name = "silicon-iam-client"
version = "4.0.0"
description = "Client for the Silicon IAM API: identity, organization governance, application login, and delegated access."
keywords = ["iam", "identity", "authentication", "authorization", "client"]
categories = ["api-bindings", "authentication"]
readme = "README.md"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/teamofsilicons/silicon-iam"
authors = ["Team of Silicons"]

[features]
default = []
cli-session = []

[lib]
name = "silicon_iam_client"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
base64 = "0.22.1"
hmac = "0.12.1"
http = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "form", "json", "rustls"] }
secrecy = "0.10.3"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = { version = "3.22.0", default-features = false }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "rt", "time"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[target."cfg(unix)".dependencies]
space-station = "0.1.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

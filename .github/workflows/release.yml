name: Release Ting
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    env:
      TING_API_URL: https://backend.ting.teamofsilicons.com
      TING_REPOSITORY_URL: https://github.com/teamofsilicons/silicon-ting
      TING_DOCS_URL: https://ting.teamofsilicons.com/docs
      TING_RUST_PACKAGE: silicon-ting-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check bundled CLI documentation
        shell: bash
        run: |
          cmp udd/cli.md crates/ting-cli/docs/cli.md
          cmp udd/api.md crates/ting-cli/docs/api.md
      - name: Test Honeycomb archive handling
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/test-package-honeycomb.py
      - name: Test Unix installer directory boundary
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-installer.py
      - name: Test client, CLI, queue and transport
        run: cargo test --locked -p silicon-ting-client -p silicon-ting-cli -p silicon-ting-daemon --target ${{ matrix.target }}
      - name: Build release
        run: cargo build --locked --release -p silicon-ting-cli -p silicon-ting-daemon --target ${{ matrix.target }}
      - name: CLI integration smoke and on-demand daemon
        shell: bash
        env:
          TING_BINARY: target/${{ matrix.target }}/release/ting${{ runner.os == 'Windows' && '.exe' || '' }}
          # Also checks that an old install's systemd unit keeps working without a prompt.
          TING_SMOKE_SYSTEM_SERVICE: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '1' || '' }}
        run: python3 crates/ting-cli/tests/smoke.py
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(target/${{ matrix.target }}/release/ting --version --json | python3 -c 'import json,sys; print("v"+json.load(sys.stdin)["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo 'Release tag must match the Cargo version.' >&2
            exit 1
          fi
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/ting-$version-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release ting ting-daemon
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = 'v' + ((& target/${{ matrix.target }}/release/ting.exe --version --json | ConvertFrom-Json).version)
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $version) { throw 'Release tag must match the Cargo version.' }
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/ting.exe,target/${{ matrix.target }}/release/ting-daemon.exe -DestinationPath "dist/ting-$version-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ting-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  no-systemd:
    # Honeycomb-only installs have no service; Silicon's WSL distro has no systemd at all.
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      # A reaping PID 1, as WSL's /init provides; the default `tail` never reaps orphans.
      options: --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ting-x86_64-unknown-linux-gnu
          path: dist
      - name: On-demand daemon as an unprivileged user without systemd
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 procps sudo
          test ! -d /run/systemd/system
          if command -v systemctl; then echo 'This job must run without systemd.' >&2; exit 1; fi
          # Like a stock EC2 ubuntu account: NOPASSWD sudo, which Ting must never use.
          useradd --create-home smoke
          echo 'smoke ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/smoke
          mkdir /opt/ting
          tar -xzf dist/ting-*-x86_64-unknown-linux-gnu.tar.gz -C /opt/ting
          sudo -u smoke env CI=true TING_BINARY=/opt/ting/ting python3 crates/ting-cli/tests/smoke.py
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, no-systemd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ting-* > SHA256SUMS
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Ting $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" ./* --clobber

[package]
name = "silicon-ting-client"
version = "0.1.4"
edition = "2024"
description = "Ting v1 HTTP and WebSocket client with exact-byte app-proof preparation"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-ting"
homepage = "https://ting.teamofsilicons.com"
readme = "../../README.md"
[lib]
name = "ting_client"
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_UI_Shell"] }
